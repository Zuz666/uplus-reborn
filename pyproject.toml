[project]
name = "uplus-reborn"
version = "1.0.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13.2"
dependencies = ["aiodiscover>=2.7.1,<4.0.0"]

[dependency-groups]
research = [
    "androguard>=4.1.4",
    "capstone>=5.0.9",
    "pyelftools>=0.33",
    "zeroconf>=0.148.0,<0.149.0",
]
test = [
    "pytest-homeassistant-custom-component==0.13.316",
    "ruff==0.17.1",
    "aiodhcpwatcher==1.2.7",
    "aiodiscover==2.7.1",
    "cached-ipaddress==1.1.2",
    "home-assistant-frontend==20260128.6",
    "ifaddr==0.2.0",
]

[tool.uv]
conflicts = [
    [
        { group = "research" },
        { group = "test" },
    ],
]
default-groups = ["research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
