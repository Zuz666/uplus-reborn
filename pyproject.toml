[project]
name = "uplus-reborn"
version = "1.1.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13.2"
dependencies = ["aiodiscover>=2.7.1,<4.0.0"]

[dependency-groups]
research = [
    "androguard>=4.1.4",
    "capstone>=5.0.9",
    "pyelftools>=0.33",
    "zeroconf>=0.150.0",
]
test = [
    "pytest-homeassistant-custom-component==0.13.316",
    "ruff==0.17.6",
]

[tool.uv]
required-version = ">=0.13.4"
default-groups = ["research"]
# Minimum Home Assistant Core 2026.2.3 and Core-owned packages live in the
# digest-pinned official base image (tools/Dockerfile), never duplicated in uv.lock.
exclude-dependencies = [
    "homeassistant",
    "aiohttp",
    "requests",
    "pydantic",
    "sqlalchemy",
    "numpy",
    "paho-mqtt",
    "coverage",
    "tqdm",
    "httpx",
    "packaging",
    "pyyaml",
    "typing-extensions",
    "python-dateutil",
    "tzdata",
    "pip",
    "urllib3",
    "certifi",
    "idna",
    "charset-normalizer",
    "yarl",
    "multidict",
    "propcache",
    "attrs",
]
override-dependencies = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tools"]

[tool.ruff]
src = [".", "tools"]

[tool.ruff.lint]
# Preserve the datetime checks removed from Ruff's defaults in 0.17.
extend-select = [
    "DTZ001",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "DTZ011",
    "DTZ012",
    "DTZ901",
]
