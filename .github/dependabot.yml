version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(deps)
    groups:
      python-tooling:
        patterns: ["*"]
        exclude-patterns:
          - homeassistant
          - home-assistant-frontend
          - pytest-homeassistant-custom-component
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(deps)
    groups:
      documentation:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /tools
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(deps)
