version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(deps)
    groups:
      python-tooling:
        patterns: ["*"]
        exclude-patterns:
          - homeassistant
          - home-assistant-frontend
          - pytest-homeassistant-custom-component
        update-types: [minor, patch]
    ignore:
      # Minimum-Core test prerequisites must match hacs.json (2026.2.3) and tools/Dockerfile.
      - dependency-name: "aiodhcpwatcher"
      - dependency-name: "aiodiscover"
      - dependency-name: "cached-ipaddress"
      - dependency-name: "home-assistant-frontend"
      - dependency-name: "ifaddr"
      - dependency-name: "pytest-homeassistant-custom-component"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(deps)
    groups:
      documentation:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /tools
    schedule:
      interval: weekly
    labels: [dependencies, "type:chore", "area:ci-release"]
    commit-message:
      prefix: chore(deps)
    ignore:
      # Minimum-Core test stage stays on Python 3.13 while hacs.json targets 2026.2.3.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
