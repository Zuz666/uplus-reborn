name: Delivery tooling and Core

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Public tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Standalone artifact and release behavior
        run: uv run --no-project --python 3.13 python -m unittest discover -s tools -p "test_*.py" -v
      - name: Validate committed release metadata
        run: uv run --no-project --python 3.13 python tools/release.py check --commit HEAD
  core:
    name: Isolated Core (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [test, core-current]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Build the exact committed package
        run: uv run --no-project --python 3.13 python tools/release.py build --commit HEAD --output build/release
      - name: Exercise the finite release matrix offline
        env:
          CORE_TARGET: ${{ matrix.target }}
        run: |
          for scenario in standby execution profiles discovery discovery-identification; do
            uv run --no-project --python 3.13 python tools/delivery.py docker --target "$CORE_TARGET" -- \
              python3 tools/ha_smoke.py --bundle build/release/bundle --scenario "$scenario" --output "build/$scenario.json"
          done
      - name: Retain the exact package and synthetic acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: core-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/*.json
            build/release/
          if-no-files-found: warn
          retention-days: 14
  artifacts:
    name: Artifact handoff
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Download the minimum-Core candidate by name
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-test-${{ github.sha }}
          path: build/downloaded/test
      - name: Download the current-Core candidate by name
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-core-current-${{ github.sha }}
          path: build/downloaded/core-current
      - name: Verify transferred candidates against the committed source
        env:
          PYTHONPATH: tools
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import os
          from pathlib import Path
          from publish_release import verify_candidate
          from release import release_metadata

          repo = Path.cwd()
          metadata = release_metadata(repo, os.environ["GITHUB_SHA"])
          for target in ("test", "core-current"):
              candidate = Path("build/downloaded") / target / "release"
              verified = verify_candidate(repo, candidate, metadata)
              print(f"{target}: verified {verified['asset']} {verified['sha256']}")
          PY
