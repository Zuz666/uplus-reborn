name: Delivery tooling and Core

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Public tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Locked native Ruff and tool-cache bootstrap
        run: uv run --no-project --python 3.13 python tools/delivery.py lint
      - name: Standalone artifact and release behavior
        run: uv run --no-project --python 3.13 python -m unittest discover -s tools -p "test_*.py" -v
      - name: Validate committed release metadata
        run: uv run --no-project --python 3.13 python tools/release.py check --commit HEAD
  package:
    name: Committed release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Build the single exact committed candidate
        run: uv run --no-project --python 3.13 python tools/release.py build --commit HEAD --output build/release
      - name: Record source, policy and producer identity
        run: uv run --no-project --python 3.13 python tools/release_evidence.py produce --candidate build/release
      - id: upload
        name: Retain the immutable candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
  core:
    name: Isolated Core (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        target: [test, core-current]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Bind comparison to the tested merge/head and its complete ancestry.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Materialize the selected Core environment inputs
        id: environment
        env:
          CORE_TARGET: ${{ matrix.target }}
        run: |
          uv run --no-project --python 3.13 python tools/delivery.py docker-context \
            --target "$CORE_TARGET" --output "$RUNNER_TEMP/uplus-env-$CORE_TARGET" --github-output "$GITHUB_OUTPUT"
      - name: Build the selected Core environment
        uses: ./.github/actions/build-image
        with:
          context: ${{ steps.environment.outputs.directory }}
          file: ${{ steps.environment.outputs.file }}
          tag: ${{ steps.environment.outputs.tag }}
          target: ${{ matrix.target }}
          scope: ${{ matrix.target }}
          build-args: ${{ steps.environment.outputs.build_args }}
      - name: Download the single candidate by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: build/release
      - name: Verify the transferred committed candidate
        run: uv run --no-project --python 3.13 python tools/release_evidence.py verify --candidate build/release
      - name: Select discovery real-time proof from the complete immutable PR
        id: discovery
        run: |
          uv run --no-project --python 3.13 python tools/discovery_acceptance.py select \
            --repo . --output build/discovery-selection.json --github-output "$GITHUB_OUTPUT"
      - name: Record the selected Core environment
        env:
          CORE_TARGET: ${{ matrix.target }}
        run: uv run --no-project --python 3.13 python tools/delivery.py docker --target "$CORE_TARGET" > build/environment.json
      - name: Exercise the finite release matrix offline
        env:
          CORE_TARGET: ${{ matrix.target }}
          DISCOVERY_TIMING: ${{ steps.discovery.outputs.discovery_timing }}
        run: |
          for scenario in standby execution profiles discovery discovery-identification; do
            timing=()
            if [[ "$scenario" == discovery ]]; then
              timing=(--discovery-timing "$DISCOVERY_TIMING" --discovery-selection build/discovery-selection.json)
            fi
            uv run --no-project --python 3.13 python tools/delivery.py docker --target "$CORE_TARGET" -- \
              python3 tools/ha_smoke.py --bundle build/release/bundle --scenario "$scenario" \
                --output "build/$scenario.json" "${timing[@]}"
          done
      - name: Summarize measured Core acceptance receipts
        if: always()
        env:
          CORE_TARGET: ${{ matrix.target }}
        run: |
          uv run --no-project --python 3.13 python tools/ci_summary.py \
            --receipts build --target "$CORE_TARGET" --output "$GITHUB_STEP_SUMMARY"
      - name: Retain synthetic Core receipts without duplicating the candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: core-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/*.json
          if-no-files-found: warn
          retention-days: 14
  artifacts:
    name: Artifact handoff
    needs: [package, core]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Download the exact producer candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: build/release
      - name: Download minimum-Core receipts from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-test-${{ github.sha }}-${{ github.run_attempt }}
          path: build/receipts/test
      - name: Download current-Core receipts from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-core-current-${{ github.sha }}-${{ github.run_attempt }}
          path: build/receipts/core-current
      - name: Bind the complete finite matrix to the producer and backend
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ needs.package.outputs.artifact_digest }}
        run: |
          uv run --no-project --python 3.13 python tools/release_evidence.py matrix \
            --candidate build/release --receipts build/receipts \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" --candidate-digest "$CANDIDATE_DIGEST" \
            --output build/matrix-evidence.json
      - name: Retain complete matrix evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: matrix-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: build/matrix-evidence.json
          if-no-files-found: error
          retention-days: 14
