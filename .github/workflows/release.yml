name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted stable version without v
        required: true
        type: string
      commit:
        description: Accepted full SHA, which must be current master
        required: true
        type: string
      publish:
        description: Explicitly authorize tag, draft, assets and publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect accepted master evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      commit: ${{ steps.guard.outputs.commit }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      candidate_id: ${{ steps.source.outputs.candidate_id }}
      matrix_id: ${{ steps.source.outputs.matrix_id }}
      inspection_id: ${{ steps.upload.outputs.artifact-id }}
      baseline: ${{ steps.baseline.outputs.tag }}
      first_release: ${{ steps.baseline.outputs.first_release }}
    steps:
      - name: Require the accepted master invocation
        id: guard
        env:
          CANDIDATE: ${{ inputs.commit }}
          REQUESTED_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$REQUESTED_REF" = refs/heads/master
          test "$REPOSITORY" = Zuz666/uplus-reborn
          test "$CANDIDATE" = "$GITHUB_SHA"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Select the exact trusted master CI run and attempt
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project --python 3.13 python tools/release_evidence.py select \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --version "$VERSION" \
            --output build/selection.json --github-output "$GITHUB_OUTPUT"
      - name: Download the original source-run candidate by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          artifact-ids: ${{ steps.source.outputs.candidate_id }}
          path: build/release
      - name: Download the original source-run matrix by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          artifact-ids: ${{ steps.source.outputs.matrix_id }}
          path: build/source-evidence
      - name: Verify authenticated source, complete matrix and exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project --python 3.13 python tools/release_evidence.py audit \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --version "$VERSION" \
            --candidate build/release --selection build/selection.json \
            --matrix build/source-evidence/matrix-evidence.json --output build/evidence.json
      - name: Freeze the pre-publication stable baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project --python 3.13 python tools/release.py baseline-select \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --output build/baseline-selection.json --github-output "$GITHUB_OUTPUT"
      - name: Materialize the independent upgrade environment
        id: environment
        if: steps.baseline.outputs.first_release != 'true'
        run: |
          uv run --no-project --python 3.13 python tools/delivery.py docker-context \
            --target core-current --output "$RUNNER_TEMP/uplus-env-core-current" --github-output "$GITHUB_OUTPUT"
      - name: Build the independent upgrade environment
        if: steps.baseline.outputs.first_release != 'true'
        uses: ./.github/actions/build-image
        with:
          context: ${{ steps.environment.outputs.directory }}
          file: ${{ steps.environment.outputs.file }}
          tag: ${{ steps.environment.outputs.tag }}
          target: core-current
          scope: core-current
      - name: Preserve the independent candidate-ZIP upgrade guard
        if: steps.baseline.outputs.first_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ steps.baseline.outputs.tag }}
        run: |
          uv run --no-project --python 3.13 python tools/release.py baseline \
            --repository "$GITHUB_REPOSITORY" --tag "$BASELINE" --output build/baseline
          uv run --no-project --python 3.13 python tools/delivery.py docker --target core-current -- \
            python3 tools/upgrade_smoke.py --from-bundle build/baseline --bundle build/release/bundle \
            --release-zip build/release/uplus_reborn.zip --output build/candidate-upgrade.json
      - id: upload
        name: Retain read-only inspection and independent upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: release-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/selection.json
            build/evidence.json
            build/candidate-upgrade.json
            build/baseline-selection.json
          if-no-files-found: warn
          retention-days: 14
  publish:
    if: inputs.publish
    needs: inspect
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Download the inspected source selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.inspect.outputs.inspection_id }}
          path: build/inspection
      - name: Download the original source candidate without rebuilding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.inspect.outputs.run_id }}
          artifact-ids: ${{ needs.inspect.outputs.candidate_id }}
          path: build/release
      - name: Download the authenticated source matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.inspect.outputs.run_id }}
          artifact-ids: ${{ needs.inspect.outputs.matrix_id }}
          path: build/source-evidence
      - name: Publish only after explicit owner approval and fresh source checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project --python 3.13 python tools/publish_release.py \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --version "$VERSION" \
            --candidate build/release --selection build/inspection/selection.json \
            --matrix build/source-evidence/matrix-evidence.json --approve
  hacs:
    if: inputs.publish
    needs: [inspect, publish]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/hacs-acceptance.yml
    with:
      tag: v${{ inputs.version }}
      baseline: ${{ needs.inspect.outputs.baseline }}
      first_release: ${{ needs.inspect.outputs.first_release == 'true' }}
      expect_latest: true
  outcome:
    if: always()
    needs: [inspect, publish, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Observe advisory availability without security dismissal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python 3.13 python tools/release.py advisories \
            --repository "$GITHUB_REPOSITORY" --output build/advisories.json
      - name: Retain the exact release, acceptance and evidence outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REQUESTED: ${{ inputs.publish }}
          SOURCE_RUN: ${{ needs.inspect.outputs.run_id }}
          UPLUS_RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
                --version "$VERSION" --publication-requested "$REQUESTED"
                --output build/release-outcome.json --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$SOURCE_RUN" ]; then args+=(--source-run "$SOURCE_RUN"); fi
          if [ -f build/advisories.json ]; then args+=(--advisories build/advisories.json); fi
          uv run --no-project --python 3.13 python tools/release.py report "${args[@]}"
      - name: Upload the terminal report including unavailable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: release-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-outcome.json
            build/advisories.json
          if-no-files-found: warn
          retention-days: 14
