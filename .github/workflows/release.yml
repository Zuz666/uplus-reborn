name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted stable version without v
        required: true
        type: string
      commit:
        description: Accepted full SHA, which must be current master
        required: true
        type: string
      publish:
        description: Explicitly authorize tag, draft, assets and publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.guard.outputs.commit }}
      baseline: ${{ steps.baseline.outputs.tag }}
      first_release: ${{ steps.baseline.outputs.first_release }}
    steps:
      - name: Require the accepted master invocation
        id: guard
        env:
          CANDIDATE: ${{ inputs.commit }}
          REQUESTED_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$REQUESTED_REF" = refs/heads/master
          test "$REPOSITORY" = Zuz666/uplus-reborn
          test "$CANDIDATE" = "$GITHUB_SHA"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Freeze the pre-publication stable baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: tools
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import os
          from publish_release import pages
          from release import previous_stable
          baseline = previous_stable(pages(f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"), os.environ["VERSION"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={baseline or ''}\nfirst_release={str(baseline is None).lower()}\n")
          PY
      - name: Package the accepted version and commit
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-project --python 3.13 python tools/release.py build --commit "$GITHUB_SHA" --version "$VERSION" --output build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: release-candidate-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
  checks:
    needs: candidate
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/ci.yml
  inspect:
    needs: [candidate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: build/release
      - name: Inspect remote state without writes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: uv run --no-project --python 3.13 python tools/publish_release.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --version "$VERSION" --candidate build/release
  publish:
    if: inputs.publish
    needs: [candidate, checks, inspect]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: build/release
      - name: Publish only after explicit owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: uv run --no-project --python 3.13 python tools/publish_release.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --version "$VERSION" --candidate build/release --approve
  hacs:
    if: inputs.publish
    needs: [candidate, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/hacs-acceptance.yml
    with:
      tag: v${{ inputs.version }}
      baseline: ${{ needs.candidate.outputs.baseline }}
      first_release: ${{ needs.candidate.outputs.first_release == 'true' }}
      expect_latest: true
  outcome:
    if: always()
    needs: [candidate, publish, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report publication separately from acceptance
        env:
          REQUESTED: ${{ inputs.publish }}
          PUBLICATION: ${{ needs.publish.result }}
          ACCEPTANCE: ${{ needs.hacs.result }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ["REQUESTED"] != "true":
              status = "Read-only preparation; no publication requested. Inspect validation jobs for their actual result."
          elif os.environ["PUBLICATION"] != "success":
              status = "Publication not confirmed. Inspect actual tag/draft/assets before any mutation; never blindly rerun publication."
          elif os.environ["ACCEPTANCE"] != "success":
              status = "Published, but HACS acceptance failed or is blocked. Assets stay immutable; rerun only the read-only acceptance workflow."
          else:
              status = "Published and accepted through real isolated HACS."
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## Release outcome\n\n" + status + "\n")
          PY
