name: Integration validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
      - name: Materialize the locked test environment inputs
        id: environment
        run: |
          uv run --no-project --python 3.13 python tools/delivery.py docker-context \
            --target test --output "$RUNNER_TEMP/uplus-env-test" --github-output "$GITHUB_OUTPUT"
      - name: Build the locked test environment
        uses: ./.github/actions/build-image
        with:
          context: ${{ steps.environment.outputs.directory }}
          file: ${{ steps.environment.outputs.file }}
          tag: ${{ steps.environment.outputs.tag }}
          target: test
          scope: test
          build-args: ${{ steps.environment.outputs.build_args }}
      - name: HA tests in the locked offline container
        run: uv run --no-project --python 3.13 python tools/delivery.py docker --target test -- pytest -q
      - name: Lint maintained Python
        run: uv run --no-project --python 3.13 python tools/delivery.py docker --target test -- ruff check custom_components tests tools
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      # Temporary official-source build; return to a compatible published image in #27.
      HASSFEST_COMMIT: 853491cd0bdfbbf54b24eab9306ded23e3c43925
      HASSFEST_SOURCE_SHA256: a4990d3bb05e28063d9fd5da6d37995e23894179de252384cf4dfeebb5250c2f
      HASSFEST_BASE: python:3.14.8-alpine@sha256:7f2ec713f0436c59df2362d973b6a05af9e87ba78f0e94f5245c302984a7a1fd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch verified official Hassfest source
        run: |
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/hassfest-source.tar.gz" \
            "https://codeload.github.com/home-assistant/core/tar.gz/$HASSFEST_COMMIT"
          echo "$HASSFEST_SOURCE_SHA256  $RUNNER_TEMP/hassfest-source.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/hassfest-source"
          tar -xzf "$RUNNER_TEMP/hassfest-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/hassfest-source"
      - name: Cache construction of the unchanged official Hassfest recipe
        uses: ./.github/actions/build-image
        with:
          context: ${{ runner.temp }}/hassfest-source
          file: ${{ runner.temp }}/hassfest-source/script/hassfest/docker/Dockerfile
          tag: uplus-hassfest:${{ env.HASSFEST_COMMIT }}
          scope: hassfest
          build-contexts: python:3.14.8-alpine=docker-image://${{ env.HASSFEST_BASE }}
      - name: Validate without network or checkout writes
        run: |
          docker run --rm --network=none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/github/workspace,readonly" \
            "uplus-hassfest:$HASSFEST_COMMIT"
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify MIT license on the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: test "$(gh api "repos/$REPOSITORY/license?ref=$COMMIT" --jq .license.spdx_id)" = MIT
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          # HACS reads default-branch metadata; the required step above checks this SHA.
          ignore: license
  supply-chain:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download checksum-pinned validators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/validators"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/validators"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/validators"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/validators/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/validators/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/validators/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/validators" actionlint
          tar -xzf "$RUNNER_TEMP/validators/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/validators" gitleaks
      - name: Validate workflow syntax and redacted snapshot findings
        run: |
          "$RUNNER_TEMP/validators/actionlint"
          "$RUNNER_TEMP/validators/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
  pr-labels:
    name: PR label rules (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Reusable workflows inherit the caller's event; uncertainty keeps both OSes.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Exercise classification and metadata safety
        run: npm run test:labels
