name: Bug report
description: Report a reproducible U+ Reborn defect with sanitized evidence.
title: "fix: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Supports Haier HWD120-B1558U only. Do not send appliance commands solely
        to fill this form. Never upload credentials, tokens, MAC/device IDs,
        serial numbers, raw captures or proprietary application files.
        Report security vulnerabilities privately instead.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: U+ Reborn version or commit
    validations:
      required: true
  - type: input
    id: core
    attributes:
      label: Home Assistant Core version
    validations:
      required: true
  - type: input
    id: hacs
    attributes:
      label: HACS version and installation method
    validations:
      required: false
  - type: input
    id: model
    attributes:
      label: Exact model and firmware if known
      description: Do not provide a serial number or device identifier.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal safe reproduction
      description: Describe existing observations; do not bypass interlocks or repeat an uncertain command.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics and relevant log excerpt
      description: Review integration diagnostics before attaching. Write N/A if unavailable.
      render: text
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Browser or Companion version and locale, for UI issues
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and private/device identifiers from all evidence.
          required: true
